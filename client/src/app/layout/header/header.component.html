<header class="shadow-md p-3 w-full bg-white min-h-20 fixed top-0 z-50">
    <div class="flex align-middle items-center justify-between max-w-full mx-auto">
        <img src="images/logo.png" alt="logo" class="max-h-16">
        <nav class="flex items-center gap-4 my-2 pl-40 uppercase text-xl">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/shop" routerLinkActive="active" >Shop</a>
            <a>Contact</a>
        </nav>
        <div class="flex gap-3 align-middle">
            <a routerLink = "/cart" routerLinkActive = "active" matBadge= "{{computedCartCount()}}" matBadgeSize="large" class="custom-badge mt-2 mr-2">
                <mat-icon>shopping_cart</mat-icon>
            </a>
            <button mat-stroked-button>Register</button>
            <button mat-stroked-button>Login</button>
        </div>
    </div>
</header>

@if(busySrevice.loading){
    <mat-progress-bar mode = "indeterminate" class="fixed top-20 z-50"></mat-progress-bar>
}
