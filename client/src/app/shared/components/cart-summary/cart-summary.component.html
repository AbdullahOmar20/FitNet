<div class="mx-auto max-w-4xl flex-1 space-y-6 w-full">
    <div class="space-y-4 p-4 rounded-lg border border-gray-200 bg-white shadow-sm">
        <P class="text-xl font-semibold">Order Summary</P>
        <div class="space-y-4">
            <div class="space-y-2">
                <dl class="flex items-center justify-between gap-4">
                    <dt class="font-medium text-gray-500">Subtotal</dt>
                    <dd class="font-medium text-gray-900">{{cartService.cartItemsTotal()?.subtotal | currency}}</dd>
                </dl>
                <dl class="flex items-center justify-between gap-4">
                    <dt class="font-medium text-gray-500">Discount</dt>
                    <dd class="font-medium text-green-500">{{cartService.cartItemsTotal()?.discount | currency}}</dd>
                </dl>
                <dl class="flex items-center justify-between gap-4">
                    <dt class="font-medium text-gray-500">Delivery fee</dt>
                    <dd class="font-medium text-gray-900">{{cartService.cartItemsTotal()?.deliveryFees | currency}}</dd>
                </dl>
            </div>

            <dl class="flex items-center justify-between gap-4 border-t border-gray-200 pt-2">
                <dt class="font-medium text-gray-500">Total</dt>
                <dd class="font-medium text-gray-900">{{cartService.cartItemsTotal()?.total | currency}}</dd>
            </dl>
        </div>
        <div class="flex flex-col gap-2">
            <button routerLink="/checkout" mat-flat-button>Checkout</button>
            <button routerLink="/shop" mat-flat-button>Continue shopping</button>
        </div>
    </div>
    <div class="space-y-4 p-2 rounded-lg border border-gray-200 bg-white shadow-sm">
        <form class="space-y-2 flex flex-col p-2">
            <label class="mb-2 block text-sm font-medium">
                Do you have voucher code?
            </label>
            <mat-form-field appearance="outline">
                <mat-label>Voucher code</mat-label>
                <input type="text" matInput>
            </mat-form-field>
            <button mat-flat-button>Apply code</button>
        </form>

    </div>
</div>
