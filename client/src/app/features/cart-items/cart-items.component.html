<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4">
    <div class="flex items-center justify-between gap-6">
        <a routerLink="/shop/{{item().id}}" class="shrink order-1">
            <img src="{{item().pictureUrl}}" alt="Product image" class="w-20 h-20">
        </a>
        <div class="flex items-center justify-between order-3">
            <div class="flex items-center align-middle gap-3">
                <button mat-icon-button>
                    <mat-icon class="text-red-600">remove</mat-icon>
                </button>

                <div class="font-semibold text-xl mb-1">{{item().quantity}}</div>

                <button mat-icon-button>
                    <mat-icon class="text-green-600">add</mat-icon>
                </button>
            </div>

            <div class="text-end order-4 w-32">
                <p class="text-xl font-bold">{{item().price | currency}}</p>
            </div>
        </div>
        <div class="w-full flex flex-col flex-1 space-y-4 order-2 max-w-md">
            <a routerLink="/shop/{{item().id}}" class="font-medium">{{item().name}}</a>
            <div class="felx items-center gap-4">
                <button mat-button class="flex items-center text-red-700 gap-2">
                    <mat-icon class="text-red-700">delete</mat-icon>
                    Delete
                </button>
            </div>
        </div>
    </div>

</div>
